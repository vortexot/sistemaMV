services:
  - type: web
    name: mv-multimarcas-api-staging
    runtime: docker
    repo: https://github.com/vortexot/sistemaMV.git
    branch: main
    region: virginia
    plan: free
    numInstances: 1
    autoDeployTrigger: "off"
    previews:
      generation: manual
    dockerfilePath: ./backend/Dockerfile
    dockerContext: ./backend
    healthCheckPath: /api/
    envVars:
      - key: APP_ENV
        value: staging
      - key: DB_NAME
        value: mv_multimarcas_staging
      - key: MONGO_URL
        sync: false
      - key: JWT_SECRET
        sync: false
      - key: MFA_ENCRYPTION_KEY
        sync: false
      - key: MFA_REQUIRED
        value: "true"
      - key: PUBLIC_ORIGIN
        sync: false
      - key: CORS_ORIGINS
        sync: false
      - key: COOKIE_SECURE
        value: "true"
      - key: FORWARDED_ALLOW_IPS
        value: "*"
      - key: STORAGE_BACKEND
        value: gridfs
      - key: STORAGE_PERSISTENT
        value: "true"
      - key: PAYMENTS_PAUSED
        value: "true"
      - key: PAYPAL_MODE
        value: sandbox
      - key: CORREIOS_ENABLED
        value: "false"
      - key: CORREIOS_ENV
        value: homologation
      - key: CORREIOS_USERNAME
        sync: false
      - key: CORREIOS_API_CODE
        sync: false
      - key: CORREIOS_ACCESS_TOKEN
        sync: false
      - key: CORREIOS_POSTING_CARD
        sync: false
      - key: CORREIOS_CONTRACT
        sync: false
      - key: CORREIOS_DR
        sync: false
      - key: CORREIOS_SERVICE_CODES
        value: 03298,03220
      - key: CORREIOS_ORIGIN_POSTAL_CODE
        value: "72871059"
      - key: CORREIOS_ITEM_WEIGHT_GRAMS
        value: "500"
      - key: CORREIOS_PACKAGE_LENGTH_CM
        value: "30"
      - key: CORREIOS_PACKAGE_WIDTH_CM
        value: "25"
      - key: CORREIOS_PACKAGE_HEIGHT_CM
        value: "10"
      - key: AUTH_EMAIL_WEBHOOK_URL
        sync: false
      - key: AUTH_EMAIL_WEBHOOK_TOKEN
        sync: false
      - key: AUTH_EMAIL_WEBHOOK_ALLOWED_HOSTS
        sync: false
      - key: ORDER_RESERVATION_MINUTES
        value: "15"
      - key: ORDER_RESERVATION_REAPER_SECONDS
        value: "60"
      - key: GOOGLE_AUTH_ENABLED
        value: "false"
